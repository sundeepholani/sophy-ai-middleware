# Dependency install scripts. pnpm 11 honors only `allowBuilds`; it dropped
# `ignoredBuiltDependencies`, and with `strictDepBuilds` (default true) any
# unreviewed script makes `pnpm install` exit non-zero — on a fresh clone it
# also writes placeholder values into this file for each undecided package.
# `verifyDepsBeforeRun` (default `install`) re-runs that install before
# `pnpm <script>` whenever dependencies change, so without a decision here
# `pnpm test` and `pnpm build` break after any pull that touches the lockfile.
#
# All three are deliberately denied. esbuild and unrs-resolver ship their
# native binaries as optional platform packages, so their postinstalls are a
# fallback nothing here needs — typecheck, lint, tests and the Vercel build
# all run without them. sharp@0.35 has no install script at all; it stays
# listed so the decision survives a downgrade.
allowBuilds:
  esbuild: false
  sharp: false
  unrs-resolver: false

# Kept for pnpm < 10.26, which predates `allowBuilds` and reads only this list.
# pnpm 10.26–10.x reads both keys; pnpm 11 reads only `allowBuilds`. Nothing in
# package.json pins a version: Vercel picks pnpm 10.x by project creation date
# (10.28.0 at the time of writing — `vercel inspect <deployment> --logs`).
ignoredBuiltDependencies:
  - esbuild
  - sharp
  - unrs-resolver

# Force patched versions of transitive deps flagged by the security scan:
# - postcss <8.5.18 (CSS source-map path traversal) via next
# - esbuild <=0.24.2 (dev-server SSRF) via drizzle-kit's deprecated @esbuild-kit/*
# - fast-uri <3.1.4 (URL host confusion) via ajv
# - sharp <0.35.0 (inherited libvips vulnerabilities) via next
overrides:
  postcss: '8.5.18'
  esbuild: '>=0.25.0'
  fast-uri: '3.1.4'
  'next@16.2.11>sharp': '0.35.3'
