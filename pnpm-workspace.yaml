ignoredBuiltDependencies:
  - sharp
  - unrs-resolver

# Force patched versions of transitive deps flagged by the security scan:
# - postcss <8.5.10 (XSS in CSS stringify) via next
# - esbuild <=0.24.2 (dev-server SSRF) via drizzle-kit's deprecated @esbuild-kit/*
overrides:
  postcss: '>=8.5.10'
  esbuild: '>=0.25.0'
